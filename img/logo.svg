<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cosmic gradient for tongue -->
    <radialGradient id="cosmicGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#c44569;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3436;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Lightning gradient -->
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  
  <!-- Main mouth shape -->
  <ellipse cx="60" cy="55" rx="35" ry="20" fill="#8b5a8c" stroke="#a569bd" stroke-width="2" filter="url(#neonGlow)"/>
  
  <!-- Upper lip highlight -->
  <ellipse cx="60" cy="48" rx="30" ry="8" fill="#bb8fce" opacity="0.7"/>
  
  <!-- Teeth -->
  <rect x="45" y="50" width="4" height="8" fill="#ffffff" rx="1"/>
  <rect x="51" y="49" width="4" height="10" fill="#ffffff" rx="1"/>
  <rect x="57" y="48" width="4" height="12" fill="#ffffff" rx="1"/>
  <rect x="63" y="48" width="4" height="12" fill="#ffffff" rx="1"/>
  <rect x="69" y="49" width="4" height="10" fill="#ffffff" rx="1"/>
  <rect x="75" y="50" width="4" height="8" fill="#ffffff" rx="1"/>
  
  <!-- Cosmic tongue -->
  <ellipse cx="60" cy="70" rx="18" ry="25" fill="url(#cosmicGradient)" filter="url(#neonGlow)"/>
  
  <!-- Tongue texture dots -->
  <circle cx="55" cy="65" r="1.5" fill="#ff9ff3" opacity="0.8"/>
  <circle cx="65" cy="68" r="1" fill="#54a0ff" opacity="0.9"/>
  <circle cx="58" cy="75" r="1.2" fill="#5f27cd" opacity="0.7"/>
  <circle cx="62" cy="80" r="0.8" fill="#00d2d3" opacity="0.8"/>
  
  <!-- Lightning bolt 1 -->
  <path d="M25 35 L30 45 L27 45 L32 55 L25 48 L28 48 L23 38 Z" fill="url(#lightningGradient)" filter="url(#neonGlow)"/>
  
  <!-- Lightning bolt 2 -->
  <path d="M90 40 L95 50 L92 50 L97 60 L90 53 L93 53 L88 43 Z" fill="url(#lightningGradient)" filter="url(#neonGlow)"/>
  
  <!-- Music note 1 -->
  <circle cx="35" cy="75" r="3" fill="#00ff88" filter="url(#neonGlow)"/>
  <rect x="37" y="60" width="2" height="15" fill="#00ff88"/>
  <path d="M39 60 Q45 58 45 62 L45 67 Q45 70 39 68 Z" fill="#00ff88"/>
  
  <!-- Music note 2 -->
  <circle cx="85" cy="80" r="2.5" fill="#00d4ff" filter="url(#neonGlow)"/>
  <rect x="86.5" y="68" width="1.5" height="12" fill="#00d4ff"/>
  
  <!-- Energy particles -->
  <circle cx="20" cy="60" r="1" fill="#ff6b9d" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="100" cy="65" r="1.2" fill="#6c5ce7" opacity="0.9" filter="url(#neonGlow)"/>
  <circle cx="30" cy="25" r="0.8" fill="#00ff88" opacity="0.7" filter="url(#neonGlow)"/>
  <circle cx="95" cy="25" r="1" fill="#00d4ff" opacity="0.8" filter="url(#neonGlow)"/>
</svg>