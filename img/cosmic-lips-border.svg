<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cosmic gradient for the lip border -->
    <linearGradient id="cosmicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Upper lip outline -->
  <path d="M 40 45 
           Q 60 25, 100 35
           Q 140 25, 160 45
           Q 150 55, 130 50
           Q 100 45, 70 50
           Q 50 55, 40 45 Z" 
        fill="none" 
        stroke="url(#cosmicGradient)" 
        stroke-width="4" 
        filter="url(#glow)"/>
  
  <!-- Lower lip outline -->
  <path d="M 45 55
           Q 70 75, 100 80
           Q 130 75, 155 55
           Q 145 65, 125 70
           Q 100 75, 75 70
           Q 55 65, 45 55 Z" 
        fill="none" 
        stroke="url(#cosmicGradient)" 
        stroke-width="4" 
        filter="url(#glow)"/>
  
  <!-- Corner curves for that signature Rolling Stones look -->
  <path d="M 35 50 Q 25 45, 30 40" 
        fill="none" 
        stroke="url(#cosmicGradient)" 
        stroke-width="3" 
        filter="url(#glow)"/>
  
  <path d="M 165 50 Q 175 45, 170 40" 
        fill="none" 
        stroke="url(#cosmicGradient)" 
        stroke-width="3" 
        filter="url(#glow)"/>
</svg>